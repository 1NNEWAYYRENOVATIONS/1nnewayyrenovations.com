<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1112">
<meta name="description" content="1NNEWAYY RENOVATIONS LLC — Residential & Commercial Renovation Solutions.">
<title>1NNEWAYY RENOVATIONS LLC | Masterpiece Presentation</title>
<style>
:root{
  --black:#0f1112;
  --gold:#d7a51f;
  --gold2:#f0c54b;
  --white:#f5f5f2;
  --line:#55595b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0d0e;color:var(--white);font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column}
header{
  position:sticky;top:0;z-index:20;background:rgba(10,12,13,.96);
  border-bottom:1px solid var(--gold);backdrop-filter:blur(8px);
  padding:10px 18px;display:flex;align-items:center;justify-content:center;gap:10px;
}
nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
nav a,.control{
  color:#fff;text-decoration:none;border:1px solid #777;border-radius:999px;
  padding:9px 18px;background:#151718;font-weight:700;font-size:14px;
}
nav a:hover,.control:hover{border-color:var(--gold2);color:var(--gold2)}
.brand{
  position:absolute;right:18px;top:7px;height:42px;width:auto;
}
main{width:100%;padding:18px 18px 28px}
.viewer{
  position:relative;max-width:1500px;margin:0 auto;background:#080a0b;
  border:1px solid #343839;box-shadow:0 0 32px rgba(215,165,31,.13);
  min-height:70vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.slide{
  display:none;width:100%;height:78vh;object-fit:contain;background:#080a0b;
  opacity:0;
}
.slide.active{display:block;animation:fadeIn .75s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;
  width:48px;height:48px;border-radius:50%;border:1px solid var(--gold2);
  background:rgba(8,10,11,.8);color:var(--gold2);font-size:30px;cursor:pointer;
}
.arrow:hover{background:#151718;box-shadow:0 0 16px rgba(215,165,31,.25)}
.prev{left:12px}.next{right:12px}
.dots{display:flex;justify-content:center;gap:8px;margin:13px 0 6px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid #888;background:transparent;cursor:pointer}
.dot.active{background:var(--gold2);box-shadow:0 0 8px rgba(240,197,75,.55)}
.counter{text-align:center;font-size:13px;letter-spacing:2px;color:#ddd}
.footer{
  max-width:1500px;margin:24px auto 0;background:#0f1112;border-top:1px solid #55595b;
  padding:34px 24px 24px;text-align:center;position:relative;
}
.footer .logo{max-width:270px;width:42vw;height:auto;display:block;margin:0 auto 8px}
.tagline{font-family:Georgia,serif;font-size:20px;font-weight:700;margin:8px 0 26px}
.touch{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:20px}
.touch:before,.touch:after{content:"";height:1px;width:160px;background:#666}
.touch span{font-size:18px;font-weight:800;letter-spacing:5px}
.footer-buttons{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.footer-buttons a{
  min-width:220px;color:#fff;text-decoration:none;border:1px solid #777;
  border-radius:9px;padding:15px 20px;background:#181a1b;font-weight:700;
}
.footer-buttons a:hover{border-color:var(--gold2);color:var(--gold2)}
.legal{
  border-top:1px solid #4b4e50;margin-top:28px;padding-top:15px;
  display:flex;justify-content:space-between;gap:20px;color:#c7c7c7;font-size:13px;
}
@media(max-width:800px){
  header{padding-right:70px}
  .brand{height:34px;right:10px}
  main{padding:8px}
  .viewer{min-height:55vh}
  .slide{height:62vh}
  .arrow{width:40px;height:40px;font-size:24px}
  .tagline{font-size:16px}
  .touch:before,.touch:after{width:50px}
  .legal{flex-direction:column;align-items:center}
}
</style>
</head>
<body>
<header>
  <nav>
    <a href="#" onclick="goTo(0);return false;">Home</a>
    <a href="#blog" onclick="goTo(11);return false;">Blog</a>
    <a href="mailto:contact@1nnewayyrenovations.com?subject=Request%20On-site%20Estimate">Request Estimate</a>
    <a href="tel:+18889138677">Call Us</a>
  </nav>
</header>

<main>
  <section class="viewer" aria-label="1NNEWAYY RENOVATIONS presentation">
    <button class="arrow prev" aria-label="Previous slide" onclick="change(-1)">‹</button>
    <button class="arrow next" aria-label="Next slide" onclick="change(1)">›</button>
    <img class="slide active" src="slides/slide-01.jpg" alt="Slide 1">
    <img class="slide" src="slides/slide-02.jpg" alt="Slide 2">
    <img class="slide" src="slides/slide-03.jpg" alt="Slide 3">
    <img class="slide" src="slides/slide-04.jpg" alt="Slide 4">
    <img class="slide" src="slides/slide-05.jpg" alt="Slide 5">
    <img class="slide" src="slides/slide-06.jpg" alt="Slide 6">
    <img class="slide" src="slides/slide-07.jpg" alt="Slide 7">
    <img class="slide" src="slides/slide-08.jpg" alt="Slide 8">
    <img class="slide" src="slides/slide-09.jpg" alt="Slide 9">
    <img class="slide" src="slides/slide-10.jpg" alt="Slide 10">
    <img class="slide" src="slides/slide-11.jpg" alt="Slide 11">
    <img class="slide" src="slides/slide-12.jpg" alt="Renovation Knowledge blog page">
  </section>
  <div class="dots" aria-label="Slide navigation">
    <button class="dot active" aria-label="Go to slide 1" onclick="goTo(0)"></button>
    <button class="dot" aria-label="Go to slide 2" onclick="goTo(1)"></button>
    <button class="dot" aria-label="Go to slide 3" onclick="goTo(2)"></button>
    <button class="dot" aria-label="Go to slide 4" onclick="goTo(3)"></button>
    <button class="dot" aria-label="Go to slide 5" onclick="goTo(4)"></button>
    <button class="dot" aria-label="Go to slide 6" onclick="goTo(5)"></button>
    <button class="dot" aria-label="Go to slide 7" onclick="goTo(6)"></button>
    <button class="dot" aria-label="Go to slide 8" onclick="goTo(7)"></button>
    <button class="dot" aria-label="Go to slide 9" onclick="goTo(8)"></button>
    <button class="dot" aria-label="Go to slide 10" onclick="goTo(9)"></button>
    <button class="dot" aria-label="Go to slide 11" onclick="goTo(10)"></button>
    <button class="dot" aria-label="Go to slide 12" onclick="goTo(11)"></button>
  </div>
  <div class="counter" id="counter">01 / 12</div>

  <footer class="footer">
    <img class="logo" src="slides/slide-01.jpg" alt="1NNEWAYY RENOVATIONS LLC logo">
    <div class="tagline">There’s only one way… and that’s the right way.</div>
    <div class="touch"><span>GET IN TOUCH</span></div>
    <div class="footer-buttons">
      <a href="tel:+18889138677">☎ Call Us</a>
      <a href="mailto:contact@1nnewayyrenovations.com">✉ Email Us</a>
      <a href="https://www.google.com/maps/search/?api=1&query=1nnewayy+Renovations+Riverview+FL" target="_blank" rel="noopener">✥ Service Area Map</a>
    </div>
    <div class="legal">
      <span>© 1NNEWAYY RENOVATIONS LLC. All rights reserved.</span>
      <span>Quality. Integrity. Results.</span>
    </div>
  </footer>
</main>

<script>
const slides=[...document.querySelectorAll('.slide')];
const dots=[...document.querySelectorAll('.dot')];
const counter=document.getElementById('counter');
let current=0, timer;

function goTo(n){
  current=(n+slides.length)%slides.length;
  slides.forEach((s,i)=>s.classList.toggle('active',i===current));
  dots.forEach((d,i)=>d.classList.toggle('active',i===current));
  counter.textContent=String(current+1).padStart(2,'0')+' / 12';
  restart();
}
function change(n){goTo(current+n)}
function restart(){
  clearInterval(timer);
  timer=setInterval(()=>change(1),6500);
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') change(1);
  if(e.key==='ArrowLeft') change(-1);
  if(e.key===' ') { e.preventDefault(); restart(); }
});
restart();
</script>
</body>
</html>
