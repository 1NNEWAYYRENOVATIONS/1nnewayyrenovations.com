    <text x="124" y="732">performing repairs or enhancing your living</text>
    <text x="124" y="763">spaces, we're here to deliver quality solutions</text>
    <text x="124" y="794">that stand the test of time. Let us help you</text>
    <text x="124" y="825">manifest your vision into your reality!</text>
